name: Build WinZapp Linux Portable

on:
  workflow_dispatch:
  push:
    paths:
      - 'linux/fix_sound_lib_linux.py'
      - 'linux/linux_usability_patch.py'
      - 'client/core/i18n.py'
      - '.github/workflows/build-linux-portable.yml'

permissions:
  contents: write

concurrency:
  group: winzapp-linux-portable
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 24.04 amd64 portable
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: winzapp-linux-portable-test-20260831
      ARCHIVE: WinZapp-Linux-Portable-amd64.tar.xz

    steps:
      - name: Checkout WinZapp fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Linux build helpers
        uses: actions/checkout@v4
        with:
          repository: joao465/joao
          path: _linux_helper
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl xz-utils file binutils patchelf \
            python3 python3-dev python3-venv python3-pip python3-wxgtk4.0 python3-pyaudio python3-speechd \
            build-essential pkg-config portaudio19-dev libsndfile1-dev libasound2-dev \
            libgtk-3-dev libglib2.0-dev libnotify-dev libdbus-1-dev \
            libnss3 libgbm1 libx11-6 libx11-xcb1 libxss1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libdrm2 libatk-bridge2.0-0 \
            libcups2 libpango-1.0-0 libpangocairo-1.0-0 libxtst6 ffmpeg

      - name: Prepare portable build script from proven Linux builder
        run: |
          set -euo pipefail
          cp _linux_helper/winzapp-linux/build_winzapp_deb.sh /tmp/build_winzapp_portable.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build_winzapp_portable.sh')
          s = p.read_text(encoding='utf-8')

          # Build the user's fork, not the upstream repository.
          old_clone = 'git clone --depth 1 https://github.com/JoaoDEVWHADS/WinZapp_Python.git "$SRC"'
          new_clone = 'git clone --depth 1 https://github.com/joao465/WinZapp_Python.git "$SRC"'
          if old_clone not in s:
              raise SystemExit('source clone line not found')
          s = s.replace(old_clone, new_clone, 1)

          # Helper paths live in the second checkout.
          s = s.replace(
              'PATCHER="$ROOT/winzapp-linux/phase1.py"',
              'PATCHER="$ROOT/_linux_helper/winzapp-linux/phase1.py"',
              1,
          )

          # Preserve the GTK accessibility fix used by the working Linux build,
          # then add Linux-native Orca names, automatic locale and short IPC.
          needle = 'python3 "$PATCHER" "$SRC"\n'
          repl = (
              needle
              + 'python3 "$ROOT/_linux_helper/winzapp-linux/linux_accessibility_patch.py" "$SRC"\n'
              + 'python3 "$ROOT/linux/linux_usability_patch.py" "$SRC"\n'
          )
          if needle not in s:
              raise SystemExit('phase1 invocation not found')
          s = s.replace(needle, repl, 1)

          # Keep Chromium in the runtime location checked by WPPConnect.
          old_cache = 'if [[ -d "$PUPPETEER_CACHE" ]]; then rm -rf "$APPDIR/puppeteer-cache"; cp -a "$PUPPETEER_CACHE" "$APPDIR/puppeteer-cache"; fi'
          new_cache = 'if [[ -d "$PUPPETEER_CACHE" ]]; then rm -rf "$APPDIR/puppeteer-cache" "$APPDIR/api/.cache"; cp -a "$PUPPETEER_CACHE" "$APPDIR/puppeteer-cache"; mkdir -p "$APPDIR/api/.cache"; cp -a "$PUPPETEER_CACHE/." "$APPDIR/api/.cache/"; fi'
          if old_cache not in s:
              raise SystemExit('Puppeteer cache copy block not found')
          s = s.replace(old_cache, new_cache, 1)

          # Convert writable paths/logging to portable mode before PyInstaller.
          marker = 'PY\n\nstep "Create build venv using distro wxGTK and PyAudio"'
          inserted = '''PY\npython3 "$ROOT/_linux_helper/winzapp-linux/portable_after_patch.py" "$SRC" "$ROOT/_linux_helper/winzapp-linux/portable_diagnostics.py"\n\nstep "Create build venv using distro wxGTK and PyAudio"'''
          if marker not in s:
              raise SystemExit('portable post-patch insertion marker not found')
          s = s.replace(marker, inserted, 1)

          # Patch sound-lib 0.83 after requirements are installed. This removes
          # its Linux device -1 -> 1 rewrite and adds robust BASS fallbacks.
          install_line = '"$VENV/bin/python" -m pip install -r "$SRC/requirements.txt"\n'
          audio_fix = install_line + '"$VENV/bin/python" "$ROOT/linux/fix_sound_lib_linux.py"\n'
          if install_line not in s:
              raise SystemExit('requirements install line not found')
          s = s.replace(install_line, audio_fix, 1)

          # accessible_output2 loads Speech Dispatcher dynamically. Bundle the
          # Python client explicitly so Orca-related WinZapp announcements work
          # from the portable executable instead of depending on host Python.
          old_hidden = '  --hidden-import wx.adv --hidden-import socketio --hidden-import engineio --hidden-import pyaudio \\\n'
          new_hidden = '  --hidden-import wx.adv --hidden-import socketio --hidden-import engineio --hidden-import pyaudio --hidden-import speechd --hidden-import speechd.client \\\n'
          if old_hidden not in s:
              raise SystemExit('PyInstaller hidden-import line not found')
          s = s.replace(old_hidden, new_hidden, 1)

          p.write_text(s, encoding='utf-8')
          PY
          chmod +x /tmp/build_winzapp_portable.sh

      - name: Compile corrected WinZapp Linux portable
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          /tmp/build_winzapp_portable.sh

      - name: Assemble portable folder without desktop integration
        run: |
          set -euo pipefail
          rm -rf portable-stage portable-out
          mkdir -p portable-stage portable-out
          DEB="$(find out -maxdepth 1 -name '*.deb' -type f | head -1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" portable-stage
          test -x portable-stage/opt/winzapp/WinZapp
          mv portable-stage/opt/winzapp portable-out/WinZapp-Linux-Portable
          find portable-out/WinZapp-Linux-Portable -name '*.desktop' -delete

          cat > portable-out/WinZapp-Linux-Portable/LEIA-ME.txt <<'EOF'
          WinZapp Linux Portable

          Execute diretamente o arquivo: ./WinZapp
          Esta versão não instala atalhos e não adiciona nada ao menu de aplicativos.

          Correções desta build:
          - BASS usa saídas Linux com fallback seguro.
          - O idioma inicial é detectado automaticamente pelo sistema.
          - Controles principais recebem nomes nativos GTK/AT-SPI para o Orca.
          - A lista de mensagens usa o modo mais simples no Linux.
          - O cliente Python do Speech Dispatcher é incluído no executável.
          - O socket IPC usa um caminho curto em XDG_RUNTIME_DIR ou /tmp.

          Os logs são gravados nesta mesma pasta:
          - session-AAAAmmdd-HHMMSS.log
          - python.log
          - crash.log

          Os dados graváveis do WinZapp também permanecem nesta pasta para manter o modo portátil.
          EOF

          chmod 0755 portable-out/WinZapp-Linux-Portable/WinZapp
          if find portable-out/WinZapp-Linux-Portable -name '*.desktop' -print -quit | grep -q .; then
            echo 'Unexpected .desktop file in portable folder' >&2
            exit 1
          fi

          tar -C portable-out -cJf "$ARCHIVE" WinZapp-Linux-Portable
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Publish corrected single-file portable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Portátil Linux com melhorias de Orca/GTK/AT-SPI, idioma automático do sistema, Speech Dispatcher empacotado, IPC Unix corrigido e fallback de áudio. Não instala atalhos nem adiciona entrada ao menu do GNOME. Extraia e execute ./WinZapp. Os logs ficam na mesma pasta do executável.'
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
              --title 'WinZapp Linux Portable - Orca e idioma automático' \
              --notes "$NOTES"
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'WinZapp Linux Portable - Orca e idioma automático' \
              --notes "$NOTES"
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets
